<style>
  :root { --main:#111111; --soft:#555555; --ink:#111111; --muted:#6b6b6b; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:linear-gradient(160deg,#F2F2F2 0%,#FFFFFF 55%,#E6E6E6 100%); color:var(--ink); font-family:Poppins,Arial,Helvetica,sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; position:relative; overflow:hidden; }

  body::after { content:""; position:absolute; bottom:-140px; right:-140px; width:320px; height:320px; border-radius:50%; background:rgba(0,0,0,.09); }

  .logo { width:130px; height:130px; border-radius:50%; margin:0 auto 20px; display:block; box-shadow:0 6px 20px rgba(0,0,0,.25); }

  .brand { font-family:Georgia,'Times New Roman',serif; font-weight:700; color:var(--main); font-size:34px; margin:0; line-height:1.1; }
  .sub { font-family:Georgia,'Times New Roman',serif; font-weight:700; color:var(--soft); letter-spacing:6px; font-size:14px; margin:8px 0 26px; }
  h1 { font-size:22px; margin:0 0 18px; }
  .card { background:#fff; border:2px solid var(--main); border-radius:20px; padding:22px 18px; text-align:left; box-shadow:0 6px 20px rgba(0,0,0,.14); }
  .label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:0 0 2px; }
  .value { font-size:17px; font-weight:600; margin:0 0 16px; }
  .iban { font-size:19px; font-weight:700; letter-spacing:1px; word-break:break-word; margin:0 0 4px; color:var(--main); }
  button { width:100%; margin-top:20px; padding:16px; border:0; border-radius:999px; background:var(--main); color:#fff; font-size:17px; font-weight:700; font-family:inherit; cursor:pointer; }
  button:active { transform:scale(.98); }
  .note { font-size:13px; color:var(--muted); margin-top:16px; }
</style>

<script>
  document.getElementById('copy').addEventListener('click', function () {
    var text = document.getElementById('iban').textContent.replace(/\s/g, '');
    var msg = document.getElementById('msg');
    function ok() { msg.textContent = 'IBAN kopyalandı ✓'; msg.style.color = '#111'; }
    function fallback() {
      var t = document.createElement('textarea');
      t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); ok(); } catch (e) { msg.textContent = 'Kopyalanamadı, IBAN\'ı elle seçin.'; }
      document.body.removeChild(t);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(ok, fallback);
    } else { fallback(); }
  });
</script>
